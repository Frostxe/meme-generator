<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор мемов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Генератор мемов</h1>
  <div class="layout">
    <section class="panel" aria-label="Настройки">
      <label for="file">Картинка (если не выбрать — будет цветной фон)</label>
      <input id="file" type="file" accept="image/*">

      <label for="top">Верхний текст</label>
      <input id="top" type="text" value="GENERATOR ">

      <label for="bottom">Нижний текст</label>
      <input id="bottom" type="text" value="MEMES">

      <label for="size">Размер текста</label>
      <input id="size" type="range" min="4" max="16" value="9">

      <div class="row">
        <div><label for="bg">Цвет фона</label><input id="bg" type="color" value="#2b4eff"></div>
        <div><label for="fill">Цвет текста</label><input id="fill" type="color" value="#ffffff"></div>
      </div>

      <button id="download">Скачать PNG</button>
      <button id="reset" class="secondary">Убрать картинку</button>
    </section>

    <section class="stage">
      <canvas id="canvas" width="700" height="700"></canvas>
    </section>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
